name: counter_project
description: "Aplikasi Counter Tasbih dan Jadwal Sholat dengan Deteksi Lokasi Otomatis dan Pilihan Lokasi Manual."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  http: ^1.1.0
  intl: ^0.18.1
  geolocator: ^10.1.0
  shared_preferences: ^2.2.2
  flutter_compass: ^0.8.0
  hijri: ^3.0.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/